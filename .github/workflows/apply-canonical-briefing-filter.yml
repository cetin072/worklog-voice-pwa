name: Apply canonical briefing filter

on:
  push:
    branches:
      - stability/canonical-briefing-snapshot

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('netlify/shared/core-logic.mjs')
          text = core.read_text()
          anchor = '''export function pageBelongsToDataSource(parentId, expectedDataSourceId){\n  if(!expectedDataSourceId || !parentId) return true;\n  const normalize=value=>String(value || "").replace(/-/g,"").toLowerCase();\n  return normalize(parentId)===normalize(expectedDataSourceId);\n}\n'''
          addition = anchor + '''\nexport function briefingSnapshotFilter(project,title){\n  return {\n    and:[\n      {property:"프로젝트",rich_text:{equals:String(project || "")}},\n      {property:"업무명",title:{equals:String(title || "")}}\n    ]\n  };\n}\n'''
          if 'export function briefingSnapshotFilter(' not in text:
              if anchor not in text:
                  raise SystemExit('core anchor not found')
              text = text.replace(anchor, addition, 1)
              core.write_text(text)

          briefing = Path('netlify/functions/briefing.mts')
          text = briefing.read_text()
          old_import = 'import { enrichBriefingStatuses, pageBelongsToDataSource, parseBriefingSnapshot, preservedQuickBriefingPeriod, quickTaskRank, sanitizeBriefingSnapshot } from "../shared/core-logic.mjs";'
          new_import = 'import { briefingSnapshotFilter, enrichBriefingStatuses, pageBelongsToDataSource, parseBriefingSnapshot, preservedQuickBriefingPeriod, quickTaskRank, sanitizeBriefingSnapshot } from "../shared/core-logic.mjs";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('briefing import anchor not found')

          old_const = 'const BRIEFING_PROJECT = "SYSTEM_DAILY_BRIEFING";'
          new_const = old_const + '\nconst BRIEFING_TITLE = "[시스템] 현재 일일 브리핑";'
          if 'const BRIEFING_TITLE =' not in text:
              if old_const not in text:
                  raise SystemExit('briefing const anchor not found')
              text = text.replace(old_const, new_const, 1)

          old_filter = 'filter:{property:"프로젝트",rich_text:{equals:BRIEFING_PROJECT}},'
          new_filter = 'filter:briefingSnapshotFilter(BRIEFING_PROJECT,BRIEFING_TITLE),'
          if old_filter in text:
              text = text.replace(old_filter, new_filter, 1)
          elif new_filter not in text:
              raise SystemExit('briefing query filter anchor not found')
          briefing.write_text(text)

          tests = Path('tests/core-functions.test.mjs')
          text = tests.read_text()
          import_anchor = '  buildKakaoBriefingMessages,\n'
          import_add = '  briefingSnapshotFilter,\n' + import_anchor
          if '  briefingSnapshotFilter,\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('test import anchor not found')
              text = text.replace(import_anchor, import_add, 1)

          test_anchor = 'test("briefing parses BRIEFING_V1 rows and rejects invalid snapshots",()=>{'
          test_block = '''test("briefing snapshot query targets only the canonical system record",()=>{\n  assert.deepEqual(briefingSnapshotFilter("SYSTEM_DAILY_BRIEFING","[시스템] 현재 일일 브리핑"),{\n    and:[\n      {property:"프로젝트",rich_text:{equals:"SYSTEM_DAILY_BRIEFING"}},\n      {property:"업무명",title:{equals:"[시스템] 현재 일일 브리핑"}}\n    ]\n  });\n});\n\n'''
          if 'briefing snapshot query targets only the canonical system record' not in text:
              if test_anchor not in text:
                  raise SystemExit('test anchor not found')
              text = text.replace(test_anchor, test_block + test_anchor, 1)
          tests.write_text(text)
          PY
      - name: Run tests
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/shared/core-logic.mjs netlify/functions/briefing.mts tests/core-functions.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "stability: target canonical briefing snapshot"
          git push
