name: One-time user-approved loading fix production dispatch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-production-dispatch-20261031.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-existing-workflow:
    if: ${{ github.repository == 'cetin072/worklog-voice-pwa' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'loading fix dispatch approved 2026-10-31') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked server dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact main server regressions before production
        run: npm test
      - name: Invoke existing guarded production-release workflow once
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ github.sha }}
        run: |
          current="$(gh api repos/cetin072/worklog-voice-pwa/git/ref/heads/main --jq '.object.sha')"
          test "$current" = "$EXPECTED_MAIN"
          gh workflow run production-release.yml --repo cetin072/worklog-voice-pwa --ref main -f action=deploy-now
