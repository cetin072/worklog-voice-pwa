name: One-time user-approved production release dispatch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-production-dispatch-20261031.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-existing-workflow:
    if: ${{ github.repository == 'cetin072/worklog-voice-pwa' && github.event.head_commit.message == 'chore(release): one-time dispatch approved 2026-10-31' }}
    runs-on: ubuntu-latest
    steps:
      - name: Invoke existing guarded production-release workflow (latest main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-release.yml --repo cetin072/worklog-voice-pwa --ref main -f action=deploy-now
