name: Pre-Human Native STT

on:
  pull_request:
    paths:
      - 'mobile/app/prehuman-stt.tsx'
      - 'mobile/src/qa/**'
      - '.github/workflows/pre-human-native-stt.yml'

permissions:
  contents: read

jobs:
  android-native-stt:
    if: github.head_ref == 'qa/421-native-stt'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Install audio conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Korean PCM16 fixture
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE_URL='https://raw.githubusercontent.com/jymsuper/SpeakerRecognition_tutorial/master/test_wavs/103F3021/test.wav'
          curl --fail --location --retry 3 --retry-delay 2 "$SAMPLE_URL" -o /tmp/pre-human-ko.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/pre-human-ko.wav -ac 1 -ar 16000 -f s16le /tmp/pre-human-ko.pcm
          python3 - <<'PY'
          import base64
          from pathlib import Path
          pcm=Path('/tmp/pre-human-ko.pcm').read_bytes()
          assert len(pcm) > 32000 and len(pcm) % 2 == 0
          encoded=base64.b64encode(pcm).decode('ascii')
          Path('mobile/src/qa/pre-human-audio-fixture.ts').write_text(
              "// generated by pre-human native STT workflow\n"
              + "export const PRE_HUMAN_PCM_BASE64 = " + repr(encoded) + ";\n",
              encoding='utf-8',
          )
          print({'pcmBytes': len(pcm), 'durationMs': round(len(pcm)/2/16000*1000)})
          PY

      - name: Typecheck QA route
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Korean audio through whisper.rn
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash mobile/scripts/pre-human-native-stt.sh
