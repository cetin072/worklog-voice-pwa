name: Pre-Human Native STT

on:
  pull_request:
    paths:
      - 'mobile/app/prehuman-stt.tsx'
      - 'mobile/src/qa/**'
      - '.github/workflows/pre-human-native-stt.yml'

permissions:
  contents: read

jobs:
  android-native-stt:
    if: github.head_ref == 'qa/pre-human-acceptance-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Generate Korean PCM16 fixture
        shell: bash
        run: |
          set -euo pipefail
          SAMPLE_URL='https://raw.githubusercontent.com/jyshin0926/KoreanTTS/master/samples_90000step_griffinlim/%E1%84%86%E1%85%A7%E1%86%BC%E1%84%8B%E1%85%A8%E1%84%89%E1%85%A9%E1%84%87%E1%85%A1%E1%86%BC%E1%84%80%E1%85%AA%E1%86%AB_kss.wav'
          curl --fail --location --retry 3 --retry-delay 2 "$SAMPLE_URL" -o /tmp/pre-human-ko.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/pre-human-ko.wav -ac 1 -ar 16000 -f s16le /tmp/pre-human-ko.pcm
          python3 - <<'PY'
          import base64
          from pathlib import Path
          pcm=Path('/tmp/pre-human-ko.pcm').read_bytes()
          assert len(pcm) > 32000 and len(pcm) % 2 == 0
          encoded=base64.b64encode(pcm).decode('ascii')
          Path('mobile/src/qa/pre-human-audio-fixture.ts').write_text(
              "// generated by pre-human native STT workflow\n"
              + "export const PRE_HUMAN_PCM_BASE64 = " + repr(encoded) + ";\n",
              encoding='utf-8',
          )
          print({'pcmBytes': len(pcm), 'durationMs': round(len(pcm)/2/16000*1000)})
          PY

      - name: Typecheck QA route
        working-directory: mobile
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Korean audio through whisper.rn
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            cd mobile/android
            ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
            APK=app/build/outputs/apk/release/app-release.apk
            adb install -r "$APK"
            adb shell am force-stop com.cetin072.worklog || true
            adb shell am start -W -a android.intent.action.VIEW -d 'worklog://prehuman-stt' -p com.cetin072.worklog

            for attempt in $(seq 1 150); do
              adb shell uiautomator dump /sdcard/prehuman.xml >/dev/null 2>&1 || true
              adb pull /sdcard/prehuman.xml /tmp/prehuman.xml >/dev/null 2>&1 || true
              if grep -q 'PREHUMAN STT PASS' /tmp/prehuman.xml 2>/dev/null; then
                echo 'Pre-Human native Korean STT PASS'
                grep -o 'text="[^"]*"' /tmp/prehuman.xml | tail -20 || true
                adb logcat -d -t 500 | grep -E 'PREHUMAN_STT_PASS|ReactNativeJS' | tail -100 || true
                exit 0
              fi
              if grep -q 'PREHUMAN STT FAIL' /tmp/prehuman.xml 2>/dev/null; then
                echo 'Pre-Human native Korean STT FAIL'
                cat /tmp/prehuman.xml || true
                adb logcat -d -t 800 | grep -E 'PREHUMAN_STT_FAIL|PREHUMAN_STT_PASS|ReactNativeJS|AndroidRuntime|rnwhisper' | tail -300 || true
                exit 1
              fi
              sleep 6
            done

            echo 'Timed out waiting for native Korean STT result.'
            cat /tmp/prehuman.xml 2>/dev/null || true
            adb logcat -d -t 1000 | grep -E 'PREHUMAN_STT_FAIL|PREHUMAN_STT_PASS|ReactNativeJS|AndroidRuntime|rnwhisper' | tail -400 || true
            exit 1
