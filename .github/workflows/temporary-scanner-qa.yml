name: Temporary scanner QA

on:
  push:
    branches:
      - feat/issue-49-document-scan-v1
    paths:
      - tests/ocr-runtime-smoke.test.mjs
      - .github/workflows/temporary-scanner-qa.yml

permissions:
  contents: read

jobs:
  scanner-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-49-document-scan-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full build and QA tests
        run: npm run build
