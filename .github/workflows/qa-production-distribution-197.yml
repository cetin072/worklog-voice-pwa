name: Temporary Production Distribution 197

on:
  push:
    branches:
      - ops/deploy-main-197

jobs:
  production-home:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public home and share metadata
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --retry 4 --retry-delay 2 https://worklog-voice-pwa.netlify.app/)"
          grep -F 'id="settingsOpen"' <<<"$html"
          grep -F 'property="og:title"' <<<"$html"
          grep -F 'property="og:image" content="https://worklog-voice-pwa.netlify.app/icons/icon-512-v3.png"' <<<"$html"
          grep -F 'Notion 연결은 필요하지 않습니다.' <<<"$html"
          curl -fsSI --retry 4 --retry-delay 2 https://worklog-voice-pwa.netlify.app/icons/icon-512-v3.png >/dev/null
          echo PRODUCTION_DISTRIBUTION_HOME_PASS
