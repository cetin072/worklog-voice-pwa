name: Generate PWA icon assets

on:
  push:
    branches:
      - fix/pwa-app-icon

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate adaptive-safe icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          OUT = Path('public/icons')
          OUT.mkdir(parents=True, exist_ok=True)
          NAVY = (17, 24, 39, 255)
          WHITE = (255, 255, 255, 255)
          ACCENT = (96, 165, 250, 255)

          def draw_mic(draw, cx, cy, scale):
              w = int(0.25 * scale)
              h = int(0.42 * scale)
              r = w // 2
              x0, y0 = cx - w//2, cy - h//2 - int(0.03*scale)
              x1, y1 = cx + w//2, cy + h//2 - int(0.03*scale)
              draw.rounded_rectangle((x0,y0,x1,y1), radius=r, fill=WHITE)
              stroke = max(6, int(0.045*scale))
              arc_box = (cx-int(0.31*scale), cy-int(0.05*scale), cx+int(0.31*scale), cy+int(0.38*scale))
              draw.arc(arc_box, 0, 180, fill=WHITE, width=stroke)
              stem_top = cy + int(0.18*scale)
              stem_bottom = cy + int(0.36*scale)
              draw.line((cx, stem_top, cx, stem_bottom), fill=WHITE, width=stroke)
              base_w = int(0.30*scale)
              draw.rounded_rectangle((cx-base_w//2, stem_bottom, cx+base_w//2, stem_bottom+stroke), radius=stroke//2, fill=WHITE)
              px = cx + int(0.22*scale)
              py = cy - int(0.20*scale)
              sw = max(5, int(0.032*scale))
              draw.line((px-int(0.07*scale), py, px-int(0.02*scale), py+int(0.05*scale)), fill=ACCENT, width=sw)
              draw.line((px-int(0.02*scale), py+int(0.05*scale), px+int(0.09*scale), py-int(0.07*scale)), fill=ACCENT, width=sw)

          def normal_icon(size):
              img = Image.new('RGBA', (size,size), (0,0,0,0))
              d = ImageDraw.Draw(img)
              margin = int(size*0.07)
              radius = int(size*0.22)
              d.rounded_rectangle((margin,margin,size-margin,size-margin), radius=radius, fill=NAVY)
              draw_mic(d, size//2, int(size*0.49), int(size*0.68))
              return img

          def maskable_icon(size):
              img = Image.new('RGBA', (size,size), NAVY)
              d = ImageDraw.Draw(img)
              draw_mic(d, size//2, int(size*0.49), int(size*0.62))
              return img

          normal_icon(192).save(OUT/'icon-192-v2.png', optimize=True)
          normal_icon(512).save(OUT/'icon-512-v2.png', optimize=True)
          maskable_icon(512).save(OUT/'icon-maskable-512-v2.png', optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/icon-192-v2.png public/icons/icon-512-v2.png public/icons/icon-maskable-512-v2.png
          git diff --cached --quiet && exit 0
          git commit -m "fix: regenerate adaptive-safe PWA icons"
          git push
