name: Temporary Production Data Core Live E2E

on:
  push:
    branches:
      - ops/production-data-core-live-e2e

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run no-Notion authenticated E2E against Production
        env:
          QA_PREVIEW_BASE: https://worklog-voice-pwa.netlify.app
        run: node scripts/qa-live-data-core-e2e.mjs
