name: Scanner QA Debug
on:
  push:
    branches:
      - feat/issue-49-document-scan-v1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:ocr
      - name: Geometry test
        continue-on-error: true
        run: node --test tests/scanner-geometry.test.mjs
      - name: Confirm flow test
        continue-on-error: true
        run: node --test tests/scanner-confirm-flow.test.mjs
      - name: Scanner v1 test
        continue-on-error: true
        run: node --test tests/scanner-v1.test.mjs
      - name: OCR UI test
        continue-on-error: true
        run: node --test tests/scanner-ocr.test.mjs
      - name: OCR retry test
        continue-on-error: true
        run: node --test tests/scanner-ocr-retry.test.mjs
      - name: OCR runtime smoke
        continue-on-error: true
        run: node --test tests/ocr-runtime-smoke.test.mjs
