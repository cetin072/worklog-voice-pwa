name: Scanner QA Debug
on:
  push:
    branches:
      - feat/issue-49-document-scan-v1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:ocr
      - run: npm test
