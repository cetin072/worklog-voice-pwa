name: Mobile App

# Main pushes run the exact-SHA post-merge Pre-Human mobile revalidation.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'mobile/app/**'
      - 'mobile/src/**'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'mobile/app.json'
      - 'mobile/app.config.js'
      - 'mobile/app.config.ts'
      - 'mobile/package-lock.json'
      - 'tests/mobile-*.test.mjs'
      - 'tests/helpers/**'
      - 'scripts/verify-mobile-device-mutations.mjs'
      - '.github/workflows/mobile-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile/app/**'
      - 'mobile/src/**'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'mobile/app.json'
      - 'mobile/app.config.js'
      - 'mobile/app.config.ts'
      - 'mobile/package-lock.json'
      - 'tests/mobile-*.test.mjs'
      - 'tests/helpers/**'
      - 'scripts/verify-mobile-device-mutations.mjs'
      - '.github/workflows/mobile-foundation.yml'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build and upload standalone ARM64 APK'
        required: false
        default: true
        type: boolean
      force_whisper_fallback_qa:
        description: 'QA-only: bypass SpeechRecognizer while retaining real Whisper/save flow'
        required: false
        default: false
        type: boolean
      qa_api_base_url:
        description: 'Optional QA API base URL for a dispatched standalone APK'
        required: false
        default: ''
        type: string

concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Announce exact-main mobile revalidation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              'MAIN_MOBILE_RUN_START',
              `sha: ${context.sha}`,
              `run_id: ${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 418,
              body,
            });
      - id: scope
        name: Detect native Android build scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ANDROID: ${{ inputs.build_android }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" || "${FORCE_ANDROID:-true}" == "true" ]]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/mobile-changed-files.txt

          if grep -Eq '^(mobile/(app/|src/|app\.json|app\.config\.(js|ts)|package-lock\.json|android/|ios/)|\.github/workflows/mobile-foundation\.yml)' /tmp/mobile-changed-files.txt; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve exact PR source for reproducible verification
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worklog-source"
          git rev-parse --verify "${SOURCE_SHA}^{commit}" > "$RUNNER_TEMP/worklog-source/SOURCE_SHA.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/worklog-source/CI_CHECKOUT_SHA.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/worklog-source/source.tar.gz" "$SOURCE_SHA"
          git ls-tree -r "$SOURCE_SHA" > "$RUNNER_TEMP/worklog-source/SOURCE_TREE.txt"
          (cd "$RUNNER_TEMP/worklog-source" && sha256sum source.tar.gz > SHA256SUMS)
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: worklog-mobile-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/worklog-source/
          if-no-files-found: error
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Bundle Android app with Metro
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir /tmp/worklog-mobile-android-export --clear
      - name: Run mobile contract and production-source runtime tests
        run: node --test tests/mobile-*.test.mjs
      - name: Verify device-state tests reject broken implementations
        run: node scripts/verify-mobile-device-mutations.mjs "$RUNNER_TEMP/device-state-mutations"
      - name: Upload device-state mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worklog-device-state-mutations
          path: ${{ runner.temp }}/device-state-mutations/
          if-no-files-found: ignore
          retention-days: 7

  android-standalone:
    needs:
      - changes
      - typecheck
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone ARM64 APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          # PR Human QA must exercise the same PR backend contract, not production main.
          EXPO_PUBLIC_API_BASE_URL: ${{ inputs.qa_api_base_url || (github.event_name == 'pull_request' && format('https://deploy-preview-{0}--worklog-voice-pwa.netlify.app', github.event.pull_request.number)) || 'https://worklog-voice-pwa.netlify.app' }}
          EXPO_PUBLIC_FORCE_WHISPER_FALLBACK_QA: ${{ inputs.force_whisper_fallback_qa && '1' || '' }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.force_whisper_fallback_qa && 'worklog-mobile-whisper-fallback-qa-arm64-apk' || 'worklog-mobile-auth-ux-arm64-apk' }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish exact-main APK evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              'MAIN_MOBILE_ARTIFACT',
              `sha: ${context.sha}`,
              `run_id: ${context.runId}`,
              'artifact: worklog-mobile-auth-ux-arm64-apk',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 418,
              body,
            });

  android-physical-qa-apk:
    needs:
      - changes
      - typecheck
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build ARM64 authenticated-home physical QA APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ANDROID_TOUCH_SMOKE: '1'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Package physical-device QA bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p physical-qa-bundle
          cp mobile/android/app/build/outputs/apk/release/app-release.apk physical-qa-bundle/worklog-physical-qa-arm64.apk
          cp mobile/qa/firebase/physical-touch-robo.json physical-qa-bundle/physical-touch-robo.json
      - name: Upload physical-device QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: worklog-physical-qa-bundle
          path: physical-qa-bundle/
          if-no-files-found: error
          retention-days: 7

  android-runtime-smoke:
    needs:
      - changes
      - typecheck
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build x86_64 authenticated-home touch APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ANDROID_TOUCH_SMOKE: '1'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch x86_64 APK and assert first screen renders
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash mobile/scripts/android-runtime-smoke.sh
