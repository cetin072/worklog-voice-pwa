name: Mobile App

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile-*.test.mjs'
      - '.github/workflows/mobile-foundation.yml'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build and upload standalone ARM64 APK'
        required: false
        default: true
        type: boolean

concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect native Android build scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_ANDROID: ${{ inputs.build_android }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${FORCE_ANDROID:-true}" == "true" ]]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/mobile-changed-files.txt

          if grep -Eq '^(mobile/(app/|src/|app\.json|app\.config\.(js|ts)|package-lock\.json|android/|ios/)|\.github/workflows/mobile-foundation\.yml)' /tmp/mobile-changed-files.txt; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Bundle Android app with Metro
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir /tmp/worklog-mobile-android-export --clear
      - name: Run mobile contract tests
        run: node --test tests/mobile-*.test.mjs

  android-standalone:
    needs:
      - changes
      - typecheck
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone ARM64 APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: worklog-mobile-auth-ux-arm64-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7


  android-runtime-smoke:
    needs:
      - changes
      - typecheck
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch x86_64 APK and assert first screen renders
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            cd mobile/android
            ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.cetin072.worklog || true
            adb shell am start -W -n com.cetin072.worklog/.MainActivity
            sleep 8
            adb shell pidof com.cetin072.worklog
            adb shell dumpsys activity activities | grep -q 'mResumedActivity.*com.cetin072.worklog'
            adb shell uiautomator dump /sdcard/worklog-window.xml >/dev/null
            adb pull /sdcard/worklog-window.xml /tmp/worklog-window.xml >/dev/null
            grep -Eq '업무수첩|연결을 확인해주세요' /tmp/worklog-window.xml
