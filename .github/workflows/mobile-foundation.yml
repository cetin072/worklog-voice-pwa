name: Mobile Foundation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile-foundation.test.mjs'
      - '.github/workflows/mobile-foundation.yml'

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/301-mobile-foundation-0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile dependency lock for audit
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile foundation contract tests
        run: node --test tests/mobile-foundation.test.mjs
      - name: Commit resolved mobile lockfile once
        run: |
          if [ -z "$(git status --porcelain -- mobile/package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore: refresh mobile dependency lock"
          git push origin HEAD:feat/301-mobile-foundation-0.1
