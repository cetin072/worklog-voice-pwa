name: Mobile Foundation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile-foundation.test.mjs'
      - '.github/workflows/mobile-foundation.yml'

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh mobile dependency lock for audit
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile foundation contract tests
        run: node --test tests/mobile-foundation.test.mjs
      - name: Upload resolved mobile lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-package-lock-refresh
          path: mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
