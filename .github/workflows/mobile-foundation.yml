name: Mobile Foundation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile-foundation.test.mjs'
      - '.github/workflows/mobile-foundation.yml'
  push:
    branches:
      - 'feat/301-mobile-foundation-0.1'
    paths:
      - 'mobile/**'
      - 'tests/mobile-foundation.test.mjs'
      - '.github/workflows/mobile-foundation.yml'

concurrency:
  group: mobile-foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Run mobile foundation contract tests
        run: node --test tests/mobile-foundation.test.mjs

  android-standalone:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone ARM64 APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: worklog-mobile-standalone-arm64-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
