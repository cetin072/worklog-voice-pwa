[build]
  command = "node scripts/scheduled-netlify-release.mjs guard scripts/release-policy.json && npm test"
  ignore = "node ./scripts/scheduled-netlify-release.mjs ignore"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self)"
    X-Robots-Tag = "noindex, nofollow"
