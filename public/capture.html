<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="robots" content="noindex,nofollow">
  <title>캡처에서 일정 찾기 · 업무수첩</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/capture.css?v=20260916-1">
</head>
<body>
  <main class="capture-app">
    <header class="capture-head">
      <a class="capture-back" href="/" aria-label="업무수첩 홈으로">←</a>
      <div><p class="eyebrow">Capture Analysis 0.1</p><h1>📸 캡처에서 일정 찾기</h1></div>
    </header>

    <section class="card capture-card">
      <h2>1. 캡처 선택</h2>
      <p class="capture-note">카카오톡·문자·메일 등의 화면 캡처를 선택하세요. 원본 이미지는 이 기기에서만 읽습니다.</p>
      <label class="capture-primary" for="captureInput">🖼 갤러리에서 캡처 선택</label>
      <input id="captureInput" class="capture-file" type="file" accept="image/*">
      <div id="capturePreviewWrap" class="capture-preview-wrap" hidden>
        <img id="capturePreview" class="capture-preview" alt="선택한 캡처 미리보기">
        <button id="captureRemove" class="capture-secondary" type="button">이미지 제거</button>
      </div>
    </section>

    <section class="card capture-card">
      <h2>2. 글자 읽기</h2>
      <p class="capture-note">한글·영문 OCR을 브라우저에서 실행합니다. 처음 실행은 OCR 엔진을 준비하느라 조금 느릴 수 있습니다.</p>
      <button id="captureRead" class="capture-primary" type="button" disabled>🔎 캡처 내용 읽기</button>
      <p id="captureOcrStatus" class="capture-status" aria-live="polite">먼저 캡처를 선택하세요.</p>
      <label class="capture-label" for="captureText">읽은 내용 · 직접 수정 가능</label>
      <textarea id="captureText" rows="9" placeholder="OCR 결과가 여기에 표시됩니다."></textarea>
    </section>

    <section class="card capture-card">
      <h2>3. 일정·업무 후보 확인</h2>
      <p class="capture-note">캡처에서 추출한 내용은 자동 저장하지 않습니다. 후보를 확인한 뒤 원하는 항목만 저장하세요.</p>
      <button id="captureAnalyze" class="capture-primary" type="button" disabled>✨ 일정·업무 후보 찾기</button>
      <p id="captureAnalyzeStatus" class="capture-status" aria-live="polite"></p>
      <div id="captureCandidates" class="capture-candidates"></div>
    </section>
  </main>

  <script src="/auth.js?v=20260915-1" defer></script>
  <script src="/platform-auth.js?v=20260916-2" defer></script>
  <script type="module" src="/capture.js?v=20260916-1"></script>
</body>
</html>
