<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="업무를 음성이나 직접 입력으로 기록하고 Notion 업무 통합 기록에 저장">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192-v3.png">
  <link rel="apple-touch-icon" href="/icons/icon-192-v3.png">
  <title>업무수첩</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/briefing.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">업무 통합 기록</p>
        <h1>🎙 업무수첩</h1>
      </div>
      <span id="health" class="badge">확인 중</span>
    </header>

    <section class="card voice-card">
      <button id="mic" class="mic" type="button">
        <span class="micIcon">🎙</span>
        <span id="micText">말하기</span>
      </button>
      <p id="hint">중지하면 바로 저장됩니다. 여러 건이면 “다음 업무”, “다음 건”, “그다음”처럼 구분해 말하세요.</p>
      <button id="save" class="save" type="button">Notion에 저장</button>
      <button id="manualEntry" class="manual-entry" type="button" aria-controls="text">⌨ 직접 입력</button>
      <button id="clear" class="clear" type="button">입력 지우기</button>
      <p id="result" class="result" aria-live="polite"></p>
    </section>

    <section id="briefingCard" class="card briefing-card" aria-live="polite">
      <div class="briefing-head">
        <div>
          <p class="eyebrow">오늘 브리핑</p>
          <h2 id="briefingTitle">오늘 업무 확인 중</h2>
        </div>
        <div class="briefing-actions">
          <button id="briefingQuickUpdate" class="briefing-quick" type="button">브리핑 다시 정리</button>
        </div>
      </div>
      <p id="briefingMeta" class="briefing-meta">Notion 최신 업무를 불러옵니다.</p>
      <ol id="briefingTop" class="briefing-list">
        <li class="briefing-empty">브리핑을 불러오는 중입니다.</li>
      </ol>
      <details class="briefing-more">
        <summary>오늘 일정 · 다가오는 일정</summary>
        <p class="label">오늘 확정 일정</p>
        <ul id="briefingToday" class="briefing-list">
          <li class="briefing-empty">확인 중입니다.</li>
        </ul>
        <p class="label">14일 안의 일정</p>
        <ul id="briefingUpcoming" class="briefing-list">
          <li class="briefing-empty">확인 중입니다.</li>
        </ul>
      </details>
      <p id="briefingError" class="briefing-error"></p>
      <div id="kakaoDelivery" class="kakao-delivery">
        <button id="kakaoBriefingAction" class="kakao-briefing-action" type="button">카카오 연결</button>
        <p id="kakaoBriefingStatus" class="kakao-briefing-status">내 카카오톡으로 브리핑을 받을 수 있습니다.</p>
      </div>
    </section>

    <section id="entryCard" class="card">
      <label class="label" for="text">업무 내용</label>
      <textarea id="text" rows="5" placeholder="말하거나 직접 입력하세요. 예: 계좌 개설 서류 확인해야 함."></textarea>
      <button id="typedSave" class="save typed-save" type="button">Notion에 저장</button>

      <div class="grid">
        <label><span>기관</span>
          <select id="institution">
            <option value="태장">태장</option>
            <option value="미래여성가족진흥원">미래여성가족진흥원</option>
            <option value="기타" selected>기타</option>
          </select>
        </label>

        <label><span>상태</span>
          <select id="status">
            <option value="완료">완료</option>
            <option value="진행중" selected>진행중</option>
            <option value="대기">대기</option>
            <option value="확인필요">확인필요</option>
          </select>
        </label>

        <label><span>유형</span>
          <select id="type">
            <option value="완료업무">완료업무</option>
            <option value="할 일">할 일</option>
            <option value="회의·통화">회의·통화</option>
            <option value="지출·세무">지출·세무</option>
            <option value="지시·위임">지시·위임</option>
            <option value="아이디어">아이디어</option>
            <option value="문제·확인">문제·확인</option>
            <option value="기타" selected>기타</option>
          </select>
        </label>
      </div>

      <details>
        <summary>추가 정보</summary>
        <div class="detailsGrid">
          <label><span>금액</span><input id="amount" type="number" inputmode="numeric" min="0"></label>
          <label><span>담당자</span><input id="assignee" type="text"></label>
          <label><span>기한</span><input id="dueDate" type="date"></label>
          <label class="wide"><span>후속조치</span><input id="followUp" type="text"></label>
        </div>
      </details>
    </section>

    <footer>v1.6.0 · 녹음 우선 · 브리핑 2.0 · 직접 입력 · 카카오 브리핑 · AI API 없음</footer>
  </main>

  <script src="/auth.js" defer></script>
  <script src="/request-id.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/inference-guard.js" defer></script>
  <script src="/quick-save.js" defer></script>
  <script src="/manual-input.js" defer></script>
  <script src="/briefing.js" defer></script>
  <script src="/briefing-v2.js" defer></script>
  <script src="/briefing-v2-expand-state.js" defer></script>
  <script src="/kakao.js" defer></script>
</body>
</html>
